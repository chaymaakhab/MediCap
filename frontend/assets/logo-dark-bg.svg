<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <!-- Dark Modern Clinical Card Background -->
  <rect width="120" height="120" rx="28" fill="#061A12"/>
  <rect width="118" height="118" x="1" y="1" rx="27" fill="none" stroke="#0D3324" stroke-width="1.5"/>

  <g transform="translate(10, 10)">
    <defs>
      <linearGradient id="darkBgDarkGreen" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#005C38"/>
        <stop offset="100%" stop-color="#0A8050"/>
      </linearGradient>
      <linearGradient id="darkBgSoftGreen" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#10B981"/>
        <stop offset="100%" stop-color="#34D399"/>
      </linearGradient>
      <filter id="darkGlow" x="-20%" y="-20%" width="140%" height="140%">
        <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#34D399" flood-opacity="0.3"/>
      </filter>
    </defs>

    <!-- Vertical cross beam -->
    <rect x="36" y="8" width="28" height="84" rx="14" fill="url(#darkBgDarkGreen)"/>

    <!-- Left horizontal cross arm -->
    <rect x="8" y="36" width="36" height="28" rx="14" fill="url(#darkBgDarkGreen)"/>

    <!-- Right horizontal cross arm (Soft Green Capsule with glow) -->
    <rect x="44" y="36" width="48" height="28" rx="14" fill="url(#darkBgSoftGreen)" filter="url(#darkGlow)"/>

    <!-- Overlap blend circle -->
    <circle cx="50" cy="50" r="14" fill="#063820" fill-opacity="0.5"/>

    <!-- Central White Bold 'C' Glyph -->
    <path d="M 60 41.5 C 57.5 39 53.5 38 49 38 C 42 38 37 43 37 50 C 37 57 42 62 49 62 C 53.8 62 57.6 61 60 58.5" 
          stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
