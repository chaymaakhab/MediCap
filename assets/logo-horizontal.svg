<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="100%" height="100%" fill="none">
  <defs>
    <!-- Dark Green Gradient -->
    <linearGradient id="cliniqoDarkGreenHoriz" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#004629"/>
      <stop offset="100%" stop-color="#005B38"/>
    </linearGradient>
    <!-- Soft Green Gradient -->
    <linearGradient id="cliniqoSoftGreenHoriz" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>
    <filter id="softShadowHoriz" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#004629" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Logo Mark (scaled & placed at x=4, y=4) -->
  <g transform="translate(4, 4) scale(0.72)">
    <!-- Vertical cross beam -->
    <rect x="36" y="8" width="28" height="84" rx="14" fill="url(#cliniqoDarkGreenHoriz)" filter="url(#softShadowHoriz)"/>
    <!-- Left horizontal cross arm -->
    <rect x="8" y="36" width="36" height="28" rx="14" fill="url(#cliniqoDarkGreenHoriz)"/>
    <!-- Right horizontal cross arm (Soft Green Capsule) -->
    <rect x="44" y="36" width="48" height="28" rx="14" fill="url(#cliniqoSoftGreenHoriz)"/>
    <!-- Overlap blend circle -->
    <circle cx="50" cy="50" r="14" fill="#003820" fill-opacity="0.25"/>
    <!-- Central White Bold 'C' Glyph -->
    <path d="M 60 41.5 C 57.5 39 53.5 38 49 38 C 42 38 37 43 37 50 C 37 57 42 62 49 62 C 53.8 62 57.6 61 60 58.5" 
          stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Typography: Cliniqo -->
  <text x="88" y="44" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800" fill="#005131" letter-spacing="-0.5">Cliniqo</text>

  <!-- Badge: Medical -->
  <rect x="195" y="27" width="56" height="19" rx="5" fill="#E8F8F0"/>
  <text x="223" y="40.5" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-size="9.5" font-weight="700" fill="#005131" text-anchor="middle" letter-spacing="0.8">MEDICAL</text>

  <!-- Subtitle: Clinical Cloud OS -->
  <text x="89" y="59" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-size="10.5" font-weight="600" fill="#10B981" letter-spacing="1.2">CLINICAL CLOUD OS</text>
</svg>
